apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker-demo}
  template:
    metadata:
      labels: {app: worker-demo}
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: worker-demo}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: worker-demo
spec:
  selector: {app: worker-demo}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-demo
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: worker-demo}
